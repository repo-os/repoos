<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070a12" />
    <title>RepoOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RepoOS" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // Apply theme before first paint to avoid flash of wrong theme.
      (function () {
        var p = window.matchMedia("(prefers-color-scheme: dark)");
        var r = p.matches ? "dark" : "light";
        document.documentElement.dataset.theme = r;
        fetch("/api/config")
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var t = (d.config && d.config.theme) || "system";
            document.documentElement.dataset.theme =
              t === "system" ? (p.matches ? "dark" : "light") : t;
          })
          .catch(function () {});
        p.addEventListener("change", function (e) {
          var c = document.documentElement.dataset.theme;
          if (!c || c === "system")
            document.documentElement.dataset.theme = e.matches ? "dark" : "light";
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
