apply plugin: 'com.android.application'

// Release signing and app versioning.
//
// Secrets are never committed: CI writes the keystore from a GitHub secret and
// sets these environment variables; `just build-android-release` sets the same
// ones locally. Gradle properties (repoosAndroidKeystorePath, …) are an
// alternative for a developer who prefers ~/.gradle/gradle.properties.
//
// Debug builds need none of this. A release build fails early and clearly when
// signing is not configured — see mobile/README.md.
def envOrProp = { String envName, String propName ->
    def value = System.getenv(envName)
    if (value == null || value.trim().isEmpty()) {
        value = project.findProperty(propName)
    }
    return value == null ? null : value.toString().trim()
}

def releaseKeystorePath = envOrProp("REPOOS_ANDROID_KEYSTORE_PATH", "repoosAndroidKeystorePath")
def releaseKeystorePassword = envOrProp("REPOOS_ANDROID_KEYSTORE_PASSWORD", "repoosAndroidKeystorePassword")
def releaseKeyAlias = envOrProp("REPOOS_ANDROID_KEY_ALIAS", "repoosAndroidKeyAlias")
def releaseKeyPassword = envOrProp("REPOOS_ANDROID_KEY_PASSWORD", "repoosAndroidKeyPassword")
def releaseSigningConfigured = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

// The public APK's version comes from the release tag in CI
// (REPOOS_APP_VERSION, e.g. 0.6.23) and from mobile/package.json for a local
// build. versionCode is derived from the semver so every release installs over
// the previous one; the minor and patch components must stay below 100.
def mobilePackage = new groovy.json.JsonSlurper().parseText(file("../../package.json").text)
def defaultVersionName = (mobilePackage.version ?: "0.0.0").toString()
def appVersionName = (envOrProp("REPOOS_APP_VERSION", "repoosAppVersion") ?: defaultVersionName).replaceFirst(/^v/, "")
def versionCodeFromName = { String name ->
    def matcher = name =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!matcher.find()) {
        return 1
    }
    return (matcher.group(1).toInteger() * 10000) + (matcher.group(2).toInteger() * 100) + matcher.group(3).toInteger()
}
def appVersionCode = (envOrProp("REPOOS_APP_VERSION_CODE", "repoosAppVersionCode") ?: versionCodeFromName(appVersionName).toString()).toInteger()

// Keep the private dev channel in the debug variant's generated BuildConfig.
// Prefer the process environment (CI) and otherwise read the ignored local
// channel file. Nothing from that file is copied into the release variant.
def channelValues = [:]
def channelFile = file("$rootDir/../../.repoos/dev-update-channel.env")
if (channelFile.isFile()) {
    channelFile.eachLine { line ->
        def match = line =~ /^\s*(REPOOS_HUB_DEV_UPDATE_TOKEN|REPOOS_HUB_BUILD_COMMIT)\s*=\s*(.*?)\s*$/
        if (match.matches()) {
            channelValues[match.group(1)] = match.group(2).replaceAll(/^['"]|['"]$/, "")
        }
    }
}
def channelToken = (System.getenv("REPOOS_HUB_DEV_UPDATE_TOKEN") ?: channelValues["REPOOS_HUB_DEV_UPDATE_TOKEN"] ?: "").trim()
def channelCommit = (System.getenv("REPOOS_HUB_BUILD_COMMIT") ?: channelValues["REPOOS_HUB_BUILD_COMMIT"] ?: "unknown").trim()
def channelBaseUrl = channelToken ? "https://hub-dev-updates.repoos.org/dev/${channelToken}" : ""
def quoteBuildConfig = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace = "org.repoos.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "org.repoos.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "HUB_DEV_UPDATE_BASE_URL", '""'
        buildConfigField "String", "HUB_BUILD_COMMIT", '"unknown"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             // `!pdfjs` drops @capacitor/inappbrowser's bundled PDF.js viewer
             // (~18MB uncompressed: UI, worker, WASM, fonts, a sample PDF,
             // source maps) — this app only loads the RepoOS web UI in the
             // WebView, so in-app PDF rendering isn't needed.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!pdfjs'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            buildConfigField "String", "HUB_DEV_UPDATE_BASE_URL", quoteBuildConfig(channelBaseUrl)
            buildConfigField "String", "HUB_BUILD_COMMIT", quoteBuildConfig(channelCommit)
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// A release variant must never inherit a channel URL, even if the dev token is
// available to the same build process.
tasks.register("verifyNoReleaseDevChannel") {
    doLast {
        def configured = android.defaultConfig.buildConfigFields["HUB_DEV_UPDATE_BASE_URL"]?.value ?: '""'
        def releaseOverride = android.buildTypes.release.buildConfigFields["HUB_DEV_UPDATE_BASE_URL"]?.value
        if (configured != '""' || (releaseOverride != null && releaseOverride != '""')) {
            throw new GradleException("Dev update URL is configured in the public release variant")
        }
    }
}

// Fail a release build before it produces an unsigned or debug-signed artifact,
// with instructions instead of a vague "app-release-unsigned.apk" later.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any {
        it.name == "assembleRelease" || it.name == "bundleRelease" || it.name == "packageRelease"
    }
    if (buildingRelease && !releaseSigningConfigured) {
        throw new GradleException(
            "Release signing is not configured. Set REPOOS_ANDROID_KEYSTORE_PATH, " +
            "REPOOS_ANDROID_KEYSTORE_PASSWORD, REPOOS_ANDROID_KEY_ALIAS and " +
            "REPOOS_ANDROID_KEY_PASSWORD (or the repoosAndroid* Gradle properties). " +
            "Debug builds do not need them. See mobile/README.md → Release signing."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
