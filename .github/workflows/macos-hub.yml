name: macOS Hub

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-hub.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos-hub.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and test native Hub
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build without signing
        run: >-
          xcodebuild -project macos/RepoOSHub.xcodeproj
          -scheme RepoOSHub
          -configuration Debug
          -sdk macosx
          -derivedDataPath macos/.derived-data
          CODE_SIGNING_ALLOWED=NO build

      - name: Run unit tests without signing
        run: >-
          xcodebuild -project macos/RepoOSHub.xcodeproj
          -scheme RepoOSHub
          -destination 'platform=macOS'
          -derivedDataPath macos/.derived-data
          CODE_SIGNING_ALLOWED=NO test

  release:
    name: Release macOS Hub DMG
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release app (ad-hoc signed)
        run: >-
          xcodebuild -project macos/RepoOSHub.xcodeproj
          -scheme RepoOSHub
          -configuration Release
          -sdk macosx
          -derivedDataPath macos/.derived-data
          CODE_SIGN_IDENTITY="-"
          build

      - name: Package DMG
        run: |
          APP=$(find macos/.derived-data/Build/Products/Release -name "RepoOSHub.app" | head -1)
          mkdir -p macos/dmg-staging
          cp -R "$APP" macos/dmg-staging/
          hdiutil create \
            -volname "RepoOS Hub" \
            -srcfolder macos/dmg-staging \
            -ov -format UDZO \
            RepoOSHub.dmg

      - name: Determine channel
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RepoOSHub.dmg
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: false
