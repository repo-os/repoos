name: macOS Hub

on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-hub.yml"
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/macos-hub.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and test native Hub
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build without signing
        run: >-
          xcodebuild -project macos/RepoOSHub.xcodeproj
          -scheme RepoOSHub
          -configuration Debug
          -sdk macosx
          -derivedDataPath macos/.derived-data
          CODE_SIGNING_ALLOWED=NO build

      - name: Run unit tests without signing
        run: >-
          xcodebuild -project macos/RepoOSHub.xcodeproj
          -scheme RepoOSHub
          -destination 'platform=macOS'
          -derivedDataPath macos/.derived-data
          CODE_SIGNING_ALLOWED=NO test

  release:
    name: Release macOS Hub DMG
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release app (ad-hoc signed)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project macos/RepoOSHub.xcodeproj \
          -scheme RepoOSHub \
          -configuration Release \
          -sdk macosx \
          -derivedDataPath macos/.derived-data \
          MARKETING_VERSION="$VERSION" \
          CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
          CODE_SIGN_IDENTITY="-" \
          build

      - name: Verify release app bundle
        run: |
          APP="macos/.derived-data/Build/Products/Release/RepoOS Hub.app"
          if [[ ! -d "$APP" ]]; then
            echo "error: expected release bundle not found at $APP (PRODUCT_NAME=RepoOS Hub)"
            echo "Contents of Release products directory:"
            ls -la macos/.derived-data/Build/Products/Release/ 2>/dev/null || echo "(directory missing)"
            exit 1
          fi
          ICON="$APP/Contents/Resources/AppIcon.icns"
          if [[ ! -s "$ICON" ]]; then
            echo "error: release bundle is missing AppIcon.icns"
            exit 1
          fi
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "error: release bundle version does not match ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Package DMG
        run: |
          APP="macos/.derived-data/Build/Products/Release/RepoOS Hub.app"
          DMGBUILD_VENV="$RUNNER_TEMP/repoos-dmgbuild"
          swift macos/scripts/generate-dmg-background.swift
          python3 -m venv "$DMGBUILD_VENV"
          "$DMGBUILD_VENV/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r macos/requirements-dmg.txt
          "$DMGBUILD_VENV/bin/python" -m dmgbuild -s macos/dmg-settings.py -D "app=$APP" "RepoOS Hub" RepoOSHub.dmg

      - name: Verify DMG install experience
        run: |
          MOUNT="$(mktemp -d)"
          DEVICE=""
          cleanup() {
            if [[ -n "$DEVICE" ]]; then hdiutil detach "$DEVICE" -quiet || true; fi
            rmdir "$MOUNT" || true
          }
          trap cleanup EXIT
          DEVICE="$(hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" RepoOSHub.dmg | awk '/^\/dev\// { print $1; exit }')"
          test -d "$MOUNT/RepoOS Hub.app"
          test -s "$MOUNT/RepoOS Hub.app/Contents/Resources/AppIcon.icns"
          test -L "$MOUNT/Applications"
          test "$(readlink "$MOUNT/Applications")" = "/Applications"
          test -s "$MOUNT/.DS_Store"
          test -s "$MOUNT/.background/RepoOSHub-install-background.png"

      - name: Determine channel
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RepoOSHub.dmg
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: false
