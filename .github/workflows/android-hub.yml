name: Android Hub

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-hub.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-hub.yml"
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Android Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build web assets and sync Capacitor
        working-directory: mobile
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run sync

      - name: Build and test Android debug variant
        working-directory: mobile/android
        run: ./gradlew --no-configuration-cache assembleDebug testDebugUnitTest
