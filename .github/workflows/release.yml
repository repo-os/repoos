name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Package dist
        run: tar -czf repoos-dist.tar.gz -C dist .

      # A tag with a "-" (v0.6.0-beta.1, v0.6.0-canary.3, v0.6.0-rc.1) is a
      # prerelease channel, not the stable line. Flag it on GitHub so
      # `GET /releases/latest` (what `repoos upgrade` calls by default) never
      # hands a prerelease to a stable user, and so it doesn't steal the
      # "Latest" badge on the releases page.
      - name: Determine channel
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Release notes authored in the "Cut a release" modal travel in the
      # annotated tag's body (the git-native release record RepoOS writes).
      # `actions/checkout` fetches the tag's COMMIT into a lightweight local
      # tag (`--no-tags` plus a SHA refspec), so the annotated tag object — and
      # with it the notes — is not present. Force-fetch the real tag object
      # before reading the body back. Surface it as the GitHub release body
      # when present; when notes were left empty the file is empty and GitHub's
      # auto-generated notes are used unchanged, exactly as before.
      - name: Read release notes from the tag
        run: |
          git fetch --depth=1 --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents:body)' "${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: repoos-dist.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}

      # Stable releases are published from this exact tag. npm's trusted
      # publisher is configured for this workflow, so no long-lived npm token
      # is stored in GitHub secrets.
      - name: Set up Node for npm publishing
        if: steps.meta.outputs.prerelease == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish npm package
        if: steps.meta.outputs.prerelease == 'false'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED="$(npm view "@repo-os/repoos@$VERSION" version 2>/dev/null || true)"
          if [[ "$PUBLISHED" == "$VERSION" ]]; then
            echo "@repo-os/repoos@$VERSION is already published; continuing."
          else
            npm publish --access public --provenance
          fi

      # The tap owns the formula and commits the update with its own
      # repository-scoped GITHUB_TOKEN. This token only needs permission to
      # dispatch an event to repo-os/homebrew-tap.
      - name: Request Homebrew tap update
        if: steps.meta.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo "HOMEBREW_TAP_TOKEN is not configured." >&2
            exit 1
          }
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="https://registry.npmjs.org/@repo-os/repoos/-/repoos-${VERSION}.tgz"
          # npm accepts a publish before its tarball is available to the tap.
          # Wait here so the tap's own update job does not exhaust its retry
          # window against a guaranteed 404.
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --head "$TARBALL" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "npm tarball for ${VERSION} did not become available after 10 minutes" >&2
              exit 1
            fi
            echo "Waiting for npm tarball (attempt ${attempt}/60)…" >&2
            sleep 10
          done
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.github.com/repos/repo-os/homebrew-tap/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"repoos-release\",\"client_payload\":{\"version\":\"$VERSION\"}}"
