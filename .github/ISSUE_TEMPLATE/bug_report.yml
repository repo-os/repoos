name: Bug report
description: Report a reproducible RepoOS problem
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove any credentials, private repository details, or other sensitive material before submitting.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the visible error or failure phase, but do not paste secrets or raw environment values.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest way to reproduce it
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoOS version
      description: Run `repoos --version` if you do not know it.
      placeholder: "0.5.49"
    validations:
      required: true
  - type: textarea
    id: support-bundle
    attributes:
      label: Support bundle (optional)
      description: Attach the redacted archive from Settings → Support after inspecting it locally. Do not attach `.env`, raw logs, source archives, or anything containing secrets.
