<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Resolve the theme before first paint: a stored choice wins, otherwise the
      OS preference. Inline and synchronous on purpose — deferring this to the
      Vue app would flash the wrong theme on every load.
    -->
    <script>
      (function () {
        var t = "dark";
        try {
          var saved = localStorage.getItem("repoos-theme");
          t =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
        } catch (e) {
          /* blocked storage: fall through to dark */
        }
        document.documentElement.setAttribute("data-theme", t);
        var meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = t === "light" ? "#f6f8fc" : "#070a12";
        document.head.appendChild(meta);
      })();
    </script>
    <title>RepoOS — the repo is the operating system</title>
    <meta
      name="description"
      content="RepoOS gives coding agents a practical way to work on a real codebase: written tasks, isolated worktrees, project context, checks, review and human approval. It all lives in Git."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RepoOS" />
    <meta property="og:title" content="RepoOS — the repo is the operating system" />
    <meta
      property="og:description"
      content="Written tasks, isolated worktrees, project context, checks, review and human approval for coding agents. It all lives in Git."
    />
    <meta property="og:image" content="https://repoos.org/board.webp" />
    <meta property="og:url" content="https://repoos.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RepoOS — the repo is the operating system" />
    <meta
      name="twitter:description"
      content="Written tasks, isolated worktrees, project context, checks, review and human approval for coding agents. It all lives in Git."
    />
    <meta name="twitter:image" content="https://repoos.org/board.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
