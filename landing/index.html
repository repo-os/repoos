<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Resolve the theme before first paint: a stored choice wins, otherwise the
      OS preference. Inline and synchronous on purpose — deferring this to the
      Vue app would flash the wrong theme on every load.
    -->
    <script>
      (function () {
        var appearance = "dark";
        var design = "classic";
        try {
          var savedAppearance = localStorage.getItem("repoos-theme");
          appearance =
            savedAppearance === "light" || savedAppearance === "dark"
              ? savedAppearance
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          var savedDesign = localStorage.getItem("repoos-ui-theme");
          if (savedDesign === "gruvbox") design = "gruvbox";
        } catch (e) {
          /* blocked storage: fall through to classic + dark */
        }
        document.documentElement.setAttribute("data-theme", appearance);
        if (design === "gruvbox") {
          document.documentElement.setAttribute("data-ui-theme", "gruvbox");
        }
        var themeColor = {
          "classic-dark": "#070a12",
          "classic-light": "#f6f8fc",
          "gruvbox-dark": "#282828",
          "gruvbox-light": "#fbf1c7",
        }[design + "-" + appearance];
        var meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = themeColor;
        document.head.appendChild(meta);
      })();
    </script>
    <title>RepoOS — the repo is the operating system</title>
    <meta
      name="description"
      content="AI dev teams for CTOs and builders. Bring your own agents and models. RepoOS manages the whole development lifecycle — all in your Git repo."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RepoOS" />
    <meta property="og:title" content="RepoOS — the repo is the operating system" />
    <meta
      property="og:description"
      content="AI dev teams for CTOs and builders. Bring your own agents and models. RepoOS manages the whole development lifecycle — all in your Git repo."
    />
    <meta property="og:image" content="https://repoos.org/board.webp" />
    <meta property="og:url" content="https://repoos.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RepoOS — the repo is the operating system" />
    <meta
      name="twitter:description"
      content="AI dev teams for CTOs and builders. Bring your own agents and models. RepoOS manages the whole development lifecycle — all in your Git repo."
    />
    <meta name="twitter:image" content="https://repoos.org/board.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
