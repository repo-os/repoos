# RepoOS configuration. All fields optional — these are the defaults.

workDir = "work"
docsDir = "docs"
defaultStatus = "inbox"
defaultAssignee = "ai"
cacheDir = ".repoos"

theme = "dark"
strictBuild = false
uiTheme = "clear"
ntfyEnabled = true
ntfyTopic = ""
defaultTaskMode = "freeform"

[tunnel]
provider = "cloudflare"
enabled = true
name = "repoos-local"
domain = "dev"
tunnel_id = "961e778d-b048-46ff-a848-756e3cf235b0"
[[agents]]
name = "engineer"
cli = "opencode"
model = "opencode/deepseek-v4-flash"
enabled = true
instructions = "Implements tasks: reads the task file, writes clean code, runs `repoos check`, updates the task status."
[[agents]]
name = "reviewer"
cli = "opencode"
model = "opencode/deepseek-v4-pro"
enabled = false
instructions = "Reviews task diffs on the feature branch; requests changes by updating the task status; approves only on a green `repoos check`."
[[agents]]
name = "pm"
cli = "opencode"
model = "opencode-go/mimo-v2.5"
enabled = true
instructions = "Owns the roadmap: moves tasks between statuses, writes activity entries, keeps the work board tidy."
[[agents]]
name = "RepoOS Guide"
cli = "opencode"
model = "big pickle"
enabled = true
instructions = "A general-purpose, repository-aware assistant. Answers questions about this repository, RepoOS, tasks, statuses, issues, code, and context without changing files or task state."
