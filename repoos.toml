# RepoOS configuration. All fields optional — these are the defaults.

workDir = "work"
docsDir = "docs"
defaultStatus = "inbox"
defaultAssignee = "ai"
cacheDir = ".repoos"

theme = "dark"
strictBuild = false
uiTheme = "clear"

[tunnel]
provider = "cloudflare"
enabled = false
name = "repoos-local"
domain = "dev"
tunnel_id = "961e778d-b048-46ff-a848-756e3cf235b0"
[[agents]]
name = "engineer"
cli = "claude code"
model = "sonnet"
enabled = true
instructions = "Implements tasks: reads the task file, writes clean code, runs `repoos check`, updates the task status."
[[agents]]
name = "reviewer"
cli = "opencode"
model = "opus"
enabled = true
instructions = "Reviews a task the moment it lands in `review`: reads the diff in the task's worktree and reports bugs, edge cases, and suggestions for the human signing off. Never changes a task's status."
[[agents]]
name = "pm"
cli = "codex"
model = "gpt-5.6-sol"
enabled = true
instructions = "Owns the roadmap: moves tasks between statuses, writes activity entries, keeps the work board tidy."
